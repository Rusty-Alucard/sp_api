# Use the latest 2.1 version of CircleCI pipeline process engine
version: 2.1

# Define reusable parameters
parameters:
  go_version:
    type: string
    default: "1.24.5"
  working_directory:
    type: string
    default: "~/sp_api"

# Define common executor
executors:
  go-executor:
    docker:
      - image: cimg/golang:<< pipeline.parameters.go_version >>
    working_directory: << pipeline.parameters.working_directory >>

# Define jobs
jobs:
  test:
    executor: go-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v7-{{ checksum "go.sum" }}
            - go-mod-v7-
      - run:
          name: Install Dependencies
          command: go mod download
      - run:
          name: Run Tests
          command: |
            mkdir -p /tmp/test-reports
            gotestsum --junitfile /tmp/test-reports/unit-tests.xml --format testname --rerun-fails=2
      - store_test_results:
          path: /tmp/test-reports
      - store_artifacts:
          path: /tmp/test-reports
          destination: test-results
      - save_cache:
          key: go-mod-v7-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"
  
  lint:
    executor: go-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v7-{{ checksum "go.sum" }}
            - go-mod-v7-
      - run:
          name: Install Dependencies
          command: go mod download
      - run:
          name: Run Lint
          command: make lint
      - run:
          name: Run Lint Fix
          command: make lint-fix
          when: on_fail
      - save_cache:
          key: go-mod-v7-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"
  
  build:
    executor: go-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v7-{{ checksum "go.sum" }}
            - go-mod-v7-
      - run:
          name: Install Dependencies
          command: go mod download
      - run:
          name: Build Application
          command: go build -v -o sp_api
      - run:
          name: Test Binary
          command: ./sp_api --help || true
      - store_artifacts:
          path: sp_api
          destination: binary
      - save_cache:
          key: go-mod-v7-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"
  
  security:
    executor: go-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v7-{{ checksum "go.sum" }}
            - go-mod-v7-
      - run:
          name: Install Dependencies
          command: go mod download
      - run:
          name: Security Scan
          command: |
            go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
            gosec ./...
      - save_cache:
          key: go-mod-v7-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"
  
  coverage:
    executor: go-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v7-{{ checksum "go.sum" }}
            - go-mod-v7-
      - run:
          name: Install Dependencies
          command: go mod download
      - run:
          name: Generate Coverage
          command: |
            go test -coverprofile=coverage.out ./...
            go tool cover -html=coverage.out -o coverage.html
      - store_artifacts:
          path: coverage.out
          destination: coverage
      - store_artifacts:
          path: coverage.html
          destination: coverage
      - save_cache:
          key: go-mod-v7-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"

  # Matrix job for testing multiple Go versions
  test-matrix:
    parameters:
      go_version:
        type: string
    docker:
      - image: cimg/golang:<< parameters.go_version >>
    working_directory: << pipeline.parameters.working_directory >>
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v7-{{ checksum "go.sum" }}-<< parameters.go_version >>
            - go-mod-v7-<< parameters.go_version >>
      - run:
          name: Install Dependencies
          command: go mod download
      - run:
          name: Run Tests (Go << parameters.go_version >>)
          command: |
            mkdir -p /tmp/test-reports
            gotestsum --junitfile /tmp/test-reports/unit-tests-<< parameters.go_version >>.xml --format testname --rerun-fails=2
      - store_test_results:
          path: /tmp/test-reports
      - store_artifacts:
          path: /tmp/test-reports
          destination: test-results-<< parameters.go_version >>
      - save_cache:
          key: go-mod-v7-{{ checksum "go.sum" }}-<< parameters.go_version >>
          paths:
            - "/go/pkg/mod"

# Define workflows
workflows:
  ci-pipeline:
    jobs:
      # Fast feedback jobs - run in parallel
      - test
      - lint
      - security
      
      # Coverage can run in parallel with other jobs
      - coverage
      
      # Matrix testing for Go version compatibility
      - test-matrix:
          matrix:
            parameters:
              go_version: ["1.23", "1.24.5"]
      
      # Build only after all checks pass
      - build:
          requires:
            - test
            - lint
            - security
            - coverage
            - test-matrix
  
  # Lightweight PR validation workflow
  pr-validation:
    jobs:
      - test:
          filters:
            branches:
              ignore: main
      - lint:
          filters:
            branches:
              ignore: main
      - security:
          filters:
            branches:
              ignore: main
      - test-matrix:
          matrix:
            parameters:
              go_version: ["1.24.5"]
          filters:
            branches:
              ignore: main
  
  # Nightly comprehensive testing
  nightly:
    triggers:
      - schedule:
          cron: "0 2 * * *"  # Run at 2 AM UTC daily
          filters:
            branches:
              only: main
    jobs:
      - test-matrix:
          matrix:
            parameters:
              go_version: ["1.23", "1.24", "1.24.5"]
      - security
      - coverage