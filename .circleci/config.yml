# Use the latest 2.1 version of CircleCI pipeline process engine
version: 2.1

# Define reusable parameters
parameters:
  go_version:
    type: string
    default: "1.24"

# Define reusable commands
commands:
  restore_cache:
    steps:
      - restore_cache:
          keys:
            - go-mod-v5-{{ checksum "go.sum" }}
            - go-mod-v5-
  
  save_cache:
    steps:
      - save_cache:
          key: go-mod-v5-{{ checksum "go.sum" }}
          paths:
            - "/go/pkg/mod"
  
  install_dependencies:
    steps:
      - run:
          name: Install Dependencies
          command: go mod download
  
  run_tests:
    steps:
      - run:
          name: Run Tests
          command: |
            mkdir -p /tmp/test-reports
            gotestsum --junitfile /tmp/test-reports/unit-tests.xml
  
  run_lint:
    steps:
      - run:
          name: Run Lint
          command: make lint
  
  store_test_results:
    steps:
      - store_test_results:
          path: /tmp/test-reports

# Define jobs
jobs:
  test:
    docker:
      - image: cimg/golang:<< pipeline.parameters.go_version >>
    working_directory: ~/sp_api
    steps:
      - checkout
      - restore_cache
      - install_dependencies
      - run_tests
      - store_test_results
      - save_cache
  
  lint:
    docker:
      - image: cimg/golang:<< pipeline.parameters.go_version >>
    working_directory: ~/sp_api
    steps:
      - checkout
      - restore_cache
      - install_dependencies
      - run_lint
      - save_cache
  
  build:
    docker:
      - image: cimg/golang:<< pipeline.parameters.go_version >>
    working_directory: ~/sp_api
    steps:
      - checkout
      - restore_cache
      - install_dependencies
      - run:
          name: Build Application
          command: go build -o sp_api
      - save_cache

# Define workflows
workflows:
  test-and-build:
    jobs:
      - test
      - lint
      - build:
          requires:
            - test
            - lint